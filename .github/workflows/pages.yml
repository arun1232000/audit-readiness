name: Deploy to GitHub Pages

# Builds the frontend in demo mode (no server on Pages: submissions are simulated in the browser)
# and publishes it at https://<owner>.github.io/<repo>/.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Build (demo mode, served under /<repo>/)
        run: npx vite build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_DEMO_MODE: 'true'
      - name: SPA fallback for deep links such as /privacy
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
